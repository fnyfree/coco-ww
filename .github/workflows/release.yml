# 推到 main 的提交里 config.py 的版本号变了 -> 自动发 Release, 只带在线更新清单 update-manifest.json。
# 不打整包: 在线更新按提交号从仓库下文件, 用不到 zip。整包(带 python 运行环境)只在新装/换运行环境时
# 才要, 还是本地用 pack_release.py 打了手动传。版本号没变(或这个 tag 已经有了)就什么都不做。
# 发之前先跑一遍测试 (test.yml), 不过就不发: 清单一发出去, 用户点「更新」就拿到了。
name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - 'config.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*["'"'"']([^"'"'"']+)["'"'"'].*/\1/p' config.py | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "tag $version 已经有了, 不发"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev=$(git tag --merged HEAD --list 'v*' --sort=-v:refname | head -1)
          newest=$(printf '%s\n%s\n' "$prev" "$version" | sort -V | tail -1)
          if [ -n "$prev" ] && [ "$newest" != "$version" ]; then
            echo "::error::版本号 $version 不比上一版 $prev 新, 不发"
            exit 1
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Find full package release
        id: full
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/releases?per_page=50" \
            --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name | test("^coco-ww-.*[.]zip$")))][0].html_url // ""')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build manifest and notes
        if: steps.ver.outputs.skip == 'false'
        run: |
          python3 tools/release_manifest.py out --commit "$GITHUB_SHA" \
            --prev-tag "${{ steps.ver.outputs.prev }}" --full-url "${{ steps.full.outputs.url }}"

      - name: Create release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.version }}"
          gh release create "$v" out/update-manifest.json \
            --target "$GITHUB_SHA" --title "coco-ww $v" --notes-file out/notes.md --latest

      # 国内常连不上 GitHub 接口和 Release 附件: 版本列表和清单也放到 update-index 分支, 在线更新先从
      # raw / jsDelivr 读它 (pyappify/__init__.py)。版本号没变也跑: 手动触发就能补发, 内容没变不会多提交。
      - name: Publish update index
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          dir="$RUNNER_TEMP/update-index"
          git init -q "$dir"
          # 借 actions/checkout 留下的认证头, 不用另外配 token
          git -C "$dir" config http.https://github.com/.extraheader "$(git config --get http.https://github.com/.extraheader)"
          git -C "$dir" config user.name "github-actions[bot]"
          git -C "$dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$dir" remote add origin "https://github.com/$REPO.git"
          # ls-remote: 有这个分支返回 0, 没有返回 2, 连不上之类的其它错直接失败
          found=0
          git -C "$dir" ls-remote --exit-code --heads origin update-index >/dev/null || found=$?
          if [ "$found" -eq 0 ]; then
            # 要完整历史: 下面按「最后一次改清单的提交」引用清单, 浅克隆找不准
            git -C "$dir" fetch -q origin update-index
            git -C "$dir" checkout -q -B update-index FETCH_HEAD
          elif [ "$found" -eq 2 ]; then
            # 第一次发: 分支还没有, 从空历史开始
            git -C "$dir" symbolic-ref HEAD refs/heads/update-index
          else
            exit "$found"
          fi
          python3 tools/release_index.py manifests "$RUNNER_TEMP/releases.json" "$dir" --repo "$REPO"
          git -C "$dir" add -A manifests
          git -C "$dir" diff --cached --quiet || git -C "$dir" commit -q -m "update manifests"
          # 没新清单时还是上次那个提交, releases.json 一字不差, 不会多出提交
          ref=$(git -C "$dir" log -1 --format=%H -- manifests)
          python3 tools/release_index.py index "$RUNNER_TEMP/releases.json" "$dir" --repo "$REPO" --manifest-ref "$ref"
          git -C "$dir" add releases.json
          if git -C "$dir" diff --cached --quiet; then
            echo "版本列表没变, 不推"
            exit 0
          fi
          git -C "$dir" commit -q -m "update releases.json"
          git -C "$dir" push -q origin update-index
          # jsDelivr 对分支内容缓存 12 小时, 推完刷掉 releases.json, 国内马上能看到新版本
          curl -fsS -m 30 "https://purge.jsdelivr.net/gh/$REPO@update-index/releases.json" \
            || echo "::warning::jsDelivr 缓存没刷掉, 国内用户最晚 12 小时后才看到新版本"
